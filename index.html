<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="only light">
<title>LOTR Duel</title>
<link rel="icon" href="icons/favicon.ico" sizes="any">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<meta name="description" content="Unofficial fan implementation of The Lord of the Rings: Duel for Middle-earth for personal play. Works offline.">
<style>
:root {
  color-scheme: only light;
  --parch: #efe4c8; --parch2: #e4d3ab; --ink: #2b2118; --muted: #6b5a45; --gold: #b8892c; --gold2: #e0b850;
  --fel: #2f6db5; --sau: #a42a2a; --panel: #f7efda; --line: #c9b48a; --ok: #2f7d3a; --bad: #a42a2a;
  --g-grey: #8f8a80; --g-yellow: #e2b53b; --g-blue: #3c7cc4; --g-green: #4f9a45; --g-red: #b8402f; --g-purple: #7b4ba0;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--parch); color: var(--ink);
  font: 15px/1.35 "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; cursor: pointer; border: 1px solid var(--line); background: #fffaf0; border-radius: 8px;
  padding: 7px 12px; min-height: 38px; }
button:hover { border-color: var(--gold); }
button:disabled { opacity: .45; cursor: default; }
button.primary { background: #3d2f1f; color: #fff5dc; border-color: #3d2f1f; }
button.primary:hover { background: #57432c; }
button.ghost { background: transparent; }
.lock::after { content: " \1F512"; font-size: .8em; }
h1, h2, h3 { font-family: Georgia, "Palatino Linotype", serif; margin: .2em 0 .4em; }
a { color: #6a3e12; }
.muted { color: var(--muted); }
.fel { color: var(--fel); } .sau { color: var(--sau); }

/* ---------- landing ---------- */
.landing { min-height: 100%; display: grid; place-items: center; padding: 16px; position: relative; overflow: auto; }
.landing .art { position: fixed; inset: 0; background-image: url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxNjAwIDEwMDAiIHByZXNlcnZlQXNwZWN0UmF0aW89InhNaWRZTWlkIHNsaWNlIj4KICA8ZGVmcz4KICAgIDxsaW5lYXJHcmFkaWVudCBpZD0ic2t5IiB4MT0iMCIgeTE9IjAiIHgyPSIwIiB5Mj0iMSI+PHN0b3Agb2Zmc2V0PSIwIiBzdG9wLWNvbG9yPSIjMmIxZDJlIi8+PHN0b3Agb2Zmc2V0PSIuNTUiIHN0b3AtY29sb3I9IiNhNTQ4MmMiLz48c3RvcCBvZmZzZXQ9IjEiIHN0b3AtY29sb3I9IiNlOWEyNGEiLz48L2xpbmVhckdyYWRpZW50PgogICAgPHJhZGlhbEdyYWRpZW50IGlkPSJleWUiIGN4PSI1MCUiIGN5PSI1MCUiIHI9IjUwJSI+PHN0b3Agb2Zmc2V0PSIwIiBzdG9wLWNvbG9yPSIjZmZmMmEwIi8+PHN0b3Agb2Zmc2V0PSIuMzUiIHN0b3AtY29sb3I9IiNmZjhhMWUiLz48c3RvcCBvZmZzZXQ9IjEiIHN0b3AtY29sb3I9IiNmZjRhMDAiIHN0b3Atb3BhY2l0eT0iMCIvPjwvcmFkaWFsR3JhZGllbnQ+CiAgICA8bGluZWFyR3JhZGllbnQgaWQ9ImdvbGQiIHgxPSIwIiB5MT0iMCIgeDI9IjEiIHkyPSIxIj48c3RvcCBvZmZzZXQ9IjAiIHN0b3AtY29sb3I9IiNmZmYxYTgiLz48c3RvcCBvZmZzZXQ9Ii41IiBzdG9wLWNvbG9yPSIjZTBiMDMwIi8+PHN0b3Agb2Zmc2V0PSIxIiBzdG9wLWNvbG9yPSIjOGE1YzA4Ii8+PC9saW5lYXJHcmFkaWVudD4KICA8L2RlZnM+CiAgPHJlY3Qgd2lkdGg9IjE2MDAiIGhlaWdodD0iMTAwMCIgZmlsbD0idXJsKCNza3kpIi8+CiAgPGNpcmNsZSBjeD0iMTIxMCIgY3k9IjI2MCIgcj0iMTQwIiBmaWxsPSJ1cmwoI2V5ZSkiLz4KICA8cGF0aCBkPSJNMTE5MCAyNjAgUTEyMTAgMjAwIDEyMzAgMjYwIFExMjEwIDMyMCAxMTkwIDI2MCBaIiBmaWxsPSIjMWEwYTAwIi8+CiAgPHBhdGggZD0iTTExODAgMzAwIEwxMjAwIDEyMCBMMTIyMCAxMjAgTDEyNDAgMzAwIFoiIGZpbGw9IiMxZDE0MTQiLz4KICA8cGF0aCBkPSJNMCA3MjAgTDE4MCA1NjAgTDMwMCA2NDAgTDQ3MCA0NzAgTDY0MCA2NTAgTDgyMCA1MjAgTDEwMDAgNjYwIEwxMTUwIDQzMCBMMTMzMCA2MTAgTDE0NjAgNTIwIEwxNjAwIDYyMCBMMTYwMCAxMDAwIEwwIDEwMDAgWiIgZmlsbD0iIzNiMmEyYSIvPgogIDxwYXRoIGQ9Ik0xMDgwIDcwMCBMMTE4MCA1NDAgTDEyMTUgNTYwIEwxMjUwIDU0MCBMMTM2MCA3MDAgWiIgZmlsbD0iIzIwMTQxNCIvPgogIDxwYXRoIGQ9Ik0xMjAwIDU0OCBRMTIxNSA1MDAgMTIzMiA1NDgiIGZpbGw9Im5vbmUiIHN0cm9rZT0iI2ZmNmExYSIgc3Ryb2tlLXdpZHRoPSIxMCIgb3BhY2l0eT0iLjg1Ii8+CiAgPHBhdGggZD0iTTAgODIwIFEzMDAgNzIwIDYyMCA4MDAgVDEyMDAgNzkwIFQxNjAwIDc2MCBMMTYwMCAxMDAwIEwwIDEwMDAgWiIgZmlsbD0iIzI2MzQxZiIvPgogIDxwYXRoIGQ9Ik0wIDkwMCBRNDAw   background-position: center; filter: saturate(.9); }
.landing .art::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(20,14,8,.25), rgba(20,14,8,.65)); }
.landing .box { position: relative; width: min(460px, 100%); background: rgba(247,239,218,.96); border: 2px solid var(--gold);
  border-radius: 14px; padding: 18px 18px 12px; box-shadow: 0 10px 40px rgba(0,0,0,.45); }
.landing h1 { font-size: 26px; text-align: center; margin-bottom: 0; }
.landing .sub { text-align: center; color: var(--muted); margin-bottom: 12px; }
.field { margin: 10px 0; }
.field > label { display: block; font-weight: 600; margin-bottom: 4px; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { flex: 1 1 auto; }
.seg button.on { background: #3d2f1f; color: #fff5dc; border-color: #3d2f1f; }
.check { display: flex; align-items: center; gap: 8px; margin: 6px 0; cursor: pointer; }
.check input { width: 20px; height: 20px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.row > * { flex: 1 1 auto; }
.foot { text-align: center; margin-top: 10px; font-size: 13px; }
.foot a { cursor: pointer; }
.landing { padding-bottom: 44px; }
.l-ver { position: fixed; left: 0; right: 0; bottom: 0; margin: 0; padding: 0 12px calc(6px + env(safe-area-inset-bottom)); text-align: center;
  font-size: 12.5px; line-height: 1.2; color: #eadfc8; text-shadow: 0 1px 3px #000; z-index: 1; }
.l-ver button { min-height: 28px; padding: 2px 6px; border: 0; background: none; color: #f5d68d; font: inherit; font-weight: 700;
  text-decoration: underline; text-underline-offset: 2px; box-shadow: none; }
.l-ver button:hover { color: #fff1c9; }
[hidden] { display: none !important; }
.cl section { border-top: 1px solid var(--line); padding: 8px 0 2px; }
.cl section:first-child { border-top: 0; padding-top: 0; }
.cl h3 { margin: 0 0 4px; font-size: 15.5px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; }
.cl h3 small { font-weight: 400; font-size: 12px; color: var(--muted); }
.cl .cl-new { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: #fff; background: var(--gold);
  border-radius: 999px; padding: 1px 8px; font-family: "Segoe UI", system-ui, sans-serif; }
.cl ul { margin: 0 0 4px; padding-left: 20px; }
.cl li { margin: 2px 0; line-height: 1.4; }

/* ---------- game shell ---------- */
#game { height: 100dvh; display: grid; grid-template-rows: auto 1fr; overflow: hidden; }
.top { display: flex; align-items: center; gap: 6px; padding: 4px 6px; background: #3d2f1f; color: #fff5dc; min-height: 44px; }
.top button { background: transparent; color: #fff5dc; border-color: rgba(255,245,220,.25); padding: 4px 9px; min-height: 36px; }
.top .title { font-family: Georgia, serif; font-weight: 700; white-space: nowrap; }
.top .spacer { flex: 1; }
.pills { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.pill { display: inline-flex; gap: 6px; align-items: center; padding: 2px 8px; border-radius: 999px; background: rgba(255,255,255,.08);
  border: 1px solid rgba(255,255,255,.18); font-size: 13px; white-space: nowrap; }
.pill.active { box-shadow: 0 0 0 2px var(--gold2); }
.pill .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.main { display: grid; min-height: 0; overflow: hidden;
  grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr) 360px; grid-template-areas: "cards map side"; }
.view { min-width: 0; min-height: 0; display: flex; flex-direction: column; overflow: hidden; position: relative; }
.v-cards { grid-area: cards; border-right: 1px solid var(--line); }
.v-map { grid-area: map; }
.side { grid-area: side; display: flex; flex-direction: column; min-height: 0; background: var(--panel); border-left: 1px solid var(--line); }
.tabsbar { display: none; }
.zoom { flex: 1; min-height: 0; overflow: hidden; position: relative; touch-action: none; }
.zoom > .inner { transform-origin: 0 0; width: 100%; height: 100%; }
.zoom svg { width: 100%; height: 100%; display: block; }
.fit { position: absolute; right: 6px; top: 6px; z-index: 2; min-height: 32px; padding: 3px 8px; background: rgba(255,250,240,.9); }
svg.quest { width: 100%; max-height: 170px; height: auto; display: block; flex: none; padding: 0 4px 4px; }
.vtitle { font-family: Georgia, serif; font-weight: 700; padding: 4px 10px 0; display: flex; justify-content: space-between; align-items: baseline; }
.vtitle small { font-family: inherit; font-weight: 400; color: var(--muted); }

/* tiles */
.tiles { display: flex; gap: 6px; padding: 6px; overflow-x: auto; flex: none; }
.tile { flex: 1 1 0; min-width: 104px; border: 2px solid #8b7550; border-radius: 10px; background: linear-gradient(#f3e6c3, #e2cc98);
  padding: 5px 6px; font-size: 12px; cursor: pointer; position: relative; text-align: left; min-height: 0; }
.tile.legal { border-color: var(--gold); box-shadow: 0 0 0 2px var(--gold2); }
.tile.locked { opacity: .55; }
.tile .tn { font-weight: 700; font-family: Georgia, serif; font-size: 13px; }
.tile .ts { letter-spacing: 1px; }
.tile .tc { position: absolute; right: 4px; bottom: 3px; }
.tile.fan .tn::after { content: " \2605"; color: #8a5a00; }
.tile.empty { cursor: default; opacity: .5; border-style: dashed; background: none; }
.tile.art { background-size: cover; background-position: center 30%; color: #fff; text-shadow: 0 1px 2px #000, 0 0 4px #000; }
.tile.art .muted { color: #f1e6cc; }
.tile.art.fan .tn::after { color: #ffd76a; }
.tilebig { display: block; width: min(240px, 70%); margin: 0 auto 8px; border-radius: 10px; }
.allybig { display: block; width: min(170px, 50%); margin: 0 auto 8px; border-radius: 10px; }
.allyimg { float: left; width: 40px; border-radius: 4px; margin: 0 6px 2px 0; }
.ally::after { content: ""; display: block; clear: both; }

/* svg pieces */
.card { cursor: default; }
.card.avail { cursor: pointer; }
.card.avail > rect.cf { stroke: var(--gold2); stroke-width: 4; }
.card.target > rect.cf, .card.target > rect.cback { stroke: #ffde59; stroke-width: 6; }
.card.dim { opacity: .5; }
.cback { fill: #23402e; stroke: #b8892c; stroke-width: 2; }
.ringback { fill: none; stroke: #e0b850; stroke-width: 4; }
.slotgap { fill: none; stroke: #c9b48a; stroke-width: 2; stroke-dasharray: 6 5; }
.region { cursor: default; }
.region.target { cursor: pointer; }
.region.target > circle.rc { stroke: #ffde59; stroke-width: 9; animation: pulse 1.2s ease-in-out infinite; }
.region.sel > circle.rc { stroke: #fff; stroke-width: 10; }
.region.flash > circle.rc { animation: flash .9s ease-out 1; }
@keyframes pulse { 50% { stroke-opacity: .35; } }
@keyframes flash { 0% { stroke: #fff; stroke-width: 18; } 100% { stroke-width: 3; } }
.noanim *, .noanim *::before { animation: none !important; transition: none !important; }

/* side panel */
.prompt { padding: 8px 10px; border-bottom: 1px solid var(--line); background: #fbf5e4; }
.prompt .who { font-weight: 700; }
.prompt .msg { margin: 2px 0 6px; }
.opts { display: flex; flex-wrap: wrap; gap: 6px; max-height: 38vh; overflow: auto; }
.opts button { flex: 1 1 auto; text-align: left; }
.opts .mini { padding: 3px; min-height: 0; }
.opts .mini svg { width: 62px; height: 88px; display: block; }
.actrow { display: flex; gap: 6px; margin-top: 6px; }
.actrow button { flex: 1; }
.tabs { display: flex; border-bottom: 1px solid var(--line); }
.tabs button { flex: 1; border: 0; border-radius: 0; background: transparent; border-bottom: 3px solid transparent; }
.tabs button.on { border-bottom-color: var(--gold); font-weight: 700; }
.tabbody { flex: 1; overflow: auto; padding: 8px 10px; min-height: 0; }
.player { border: 1px solid var(--line); border-radius: 10px; padding: 8px; margin-bottom: 8px; background: #fffaf0; }
.player.p0 { border-left: 6px solid var(--fel); } .player.p1 { border-left: 6px solid var(--sau); }
.player.active { box-shadow: 0 0 0 2px var(--gold2); }
.player h3 { margin: 0 0 4px; font-size: 16px; display: flex; justify-content: space-between; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; font-size: 13px; }
.stats div { background: var(--parch); border-radius: 6px; padding: 2px 4px; text-align: center; }
.stats b { display: block; font-size: 15px; }
.sub2 { font-size: 13px; margin-top: 6px; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 3px; }
.chip { font-size: 12px; padding: 1px 7px; border-radius: 999px; background: var(--parch); border: 1px solid var(--line); }
.chip.miss { opacity: .35; }
.cc { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -1px; margin-right: 3px; }
.ally { border: 1px dashed var(--line); border-radius: 8px; padding: 4px 6px; margin-top: 4px; font-size: 13px; }
.ally b { font-family: Georgia, serif; }
.ally button { margin-top: 4px; min-height: 32px; padding: 3px 8px; }
.log { list-style: none; padding: 0; margin: 0; font-size: 13px; }
.log li { padding: 3px 0; border-bottom: 1px dotted var(--line); }
.log li.p0 { border-left: 3px solid var(--fel); padding-left: 6px; }
.log li.p1 { border-left: 3px solid var(--sau); padding-left: 6px; }
.log li.chapter, .log li.win { font-weight: 700; }
.intel li { margin: 4px 0; }

/* modal */
.backdrop { position: fixed; inset: 0; background: rgba(20,14,8,.55); z-index: 50; display: grid; place-items: center; padding: 10px; }
.modal { background: var(--panel); border: 2px solid var(--gold); border-radius: 14px; width: min(560px, 100%); max-height: 92dvh;
  display: flex; flex-direction: column; box-shadow: 0 10px 40px rgba(0,0,0,.4); position: relative; }
.modal .mh { display: flex; align-items: center; padding: 10px 12px 4px; gap: 6px; }
.modal .mh h2 { flex: 1; margin: 0; font-size: 20px; }
.modal .mh button { min-height: 34px; padding: 2px 10px; }
.modal .mb { padding: 4px 14px 10px; overflow: auto; }
.modal .mf { padding: 8px 12px 12px; display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.backdrop.docked { inset: auto 0 0 auto; width: min(380px, 100%); height: 100dvh; background: none; padding: 0; place-items: stretch; }
.backdrop.docked .modal { max-height: 100dvh; height: 100%; border-radius: 0; }
.cardbig { display: flex; gap: 12px; align-items: flex-start; }
.cardbig svg { width: 130px; flex: none; }
table.res { border-collapse: collapse; width: 100%; font-size: 14px; }
table.res th, table.res td { border-bottom: 1px solid var(--line); padding: 4px 6px; text-align: center; }
table.res th:first-child, table.res td:first-child { text-align: left; }
.minis { display: flex; flex-wrap: wrap; gap: 6px; }
.minis svg { width: 70px; height: 98px; }

/* pass-and-play */
.pass { position: fixed; inset: 0; z-index: 60; background: #2a2016; color: #fff5dc; display: grid; place-items: center; text-align: center; padding: 20px; }
.pass h2 { font-size: 28px; }

/* tests / debug */
.testlist { padding: 12px; font: 13px/1.4 Consolas, monospace; }
.testlist .f { color: var(--bad); white-space: pre-wrap; }
.testlist .p { color: var(--ok); }
.dbg { position: fixed; left: 6px; bottom: 6px; z-index: 40; background: rgba(0,0,0,.78); color: #d6ffd6; font: 12px/1.3 Consolas, monospace;
  padding: 6px 8px; border-radius: 6px; max-width: 360px; }
.dbg textarea { width: 100%; height: 120px; font: 11px Consolas, monospace; }
.toast { position: fixed; left: 50%; top: 52px; transform: translateX(-50%); background: #3d2f1f; color: #fff5dc; padding: 6px 14px;
  border-radius: 999px; z-index: 70; font-size: 14px; pointer-events: none; }

.sheetbtn { display: none !important; float: right; min-height: 28px !important; padding: 0 8px !important; }

/* ---------- fold open (2 columns, panel below) ---------- */
@media (max-width: 1099px) {
  .main { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) minmax(0, 42%);
    grid-template-areas: "cards map" "side side"; }
  .side { border-left: 0; border-top: 1px solid var(--line); flex-direction: row; }
  .side .prompt { width: 50%; border-bottom: 0; border-right: 1px solid var(--line); overflow: auto; }
  .side .panelrest { width: 50%; display: flex; flex-direction: column; min-height: 0; }
  .opts { max-height: none; }
}
@media (min-width: 1100px) { .side .panelrest { flex: 1; display: flex; flex-direction: column; min-height: 0; } }

/* ---------- phone: one view at a time, bottom sheet ---------- */
@media (max-width: 759px) {
  .top .title, .top .chpill, .top [data-a="help"] { display: none; }
  .pill { font-size: 12px; padding: 1px 6px; }
  .main { grid-template-columns: 100%; grid-template-rows: auto minmax(0, 1fr) auto; grid-template-areas: "tabs" "view" "side"; }
  .tabsbar { display: flex; grid-area: tabs; border-bottom: 1px solid var(--line); background: var(--parch2); }
  .tabsbar button { flex: 1; border: 0; border-radius: 0; background: transparent; border-bottom: 3px solid transparent; min-height: 36px; }
  .tabsbar button.on { border-bottom-color: var(--gold); font-weight: 700; }
  .v-cards, .v-map { grid-area: view; border: 0; }
  .main.show-cards .v-map, .main.show-map .v-cards { display: none; }
  .side { flex-direction: column; max-height: 52dvh; border-top: 2px solid var(--gold); box-shadow: 0 -4px 14px rgba(0,0,0,.15); }
  .side .prompt { width: auto; border-right: 0; border-bottom: 1px solid var(--line); }
  .side .panelrest { width: auto; flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .side.min .panelrest { display: none; }
  .side.min .opts { max-height: 30dvh; }
  .opts { max-height: 26dvh; }
  .sheetbtn { display: inline-block !important; }
  .stats { grid-template-columns: repeat(4, 1fr); }
  .tile { min-width: 96px; font-size: 11px; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

</style>
</head>
<body>
<div id="app"></div>
<script>
// ===== Content tables. Card IDs match card_ids/labelled_chapter*.jpg =====

function parseCost(s) {
  const c = {coins: 0, skills: []};
  for (const t of (s || '').trim().split(/\s+/).filter(Boolean)) {
    const m = t.match(/^(\d+)c$/);
    if (m) c.coins += +m[1]; else c.skills.push(t);
  }
  return c;
}

function parseCards(text) {
  const out = {};
  for (const line of text.trim().split('\n')) {
    const [id, color, eff, cost, chain] = line.split('|');
    const card = {id, ch: +id[1], color, cost: parseCost(cost), chainIn: null, chainOut: null};
    const [k, a, b] = eff.split(':');
    if (k === 'coins') card.coins = +a;
    else if (k === 'quest') card.quest = +a;
    else if (k === 'race') card.race = a;
    else if (k === 'units') { card.units = +a; card.regions = b.split(','); }
    else if (k === 'purple') card.purple = a.split(',');
    else if (k === 'skill') card.skills = a.split(' ').map(g => g.split('/'));
    for (const t of (chain || '').trim().split(/\s+/).filter(Boolean)) {
      const [dir, sym] = t.split(':');
      if (dir === 'in') card.chainIn = sym; else card.chainOut = sym;
    }
    out[id] = card;
  }
  return out;
}

// ---------- helpers ----------
const opp = p => 1 - p;
function rnd(S) {
  let t = (S.rng = (S.rng + 0x6D2B79F5) >>> 0);
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
function shuffle(S, a) {
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd(S) * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function log(S, text, kind = '') {
  if (S.sim) return;
  S.log.push({turn: S.turnNo, p: S.active, ch: S.chapter, text, kind});
}
const pname = (S, p) => (S.seats && S.seats[p] && S.seats[p].name) || SIDE_NAMES[SIDES[p]];
const rname = r => (REGIONS.find(x => x.id === r) || {name: r}).name;
const tokenRace = t => TOKENS[t].race;
const hasHook = (P, h) => P.tokens.some(t => TOKENS[t].hook === h);
const greens = P => P.cards.filter(id => CARDS[id].color === 'green').map(id => CARDS[id].race);
function distinctRaces(P, withEagle = true) {
  const n = new Set(greens(P)).size;
  return n + (withEagle && hasHook(P, 'eagle') ? 1 : 0);
}
const present = (S, p, r) => S.board[r].u[p] > 0 || S.board[r].f[p] > 0;
const regionCount = (S, p) => REGION_IDS.filter(r => present(S, p, r)).length;
const fortsOnBoard = (S, p) => REGION_IDS.reduce((n, r) => n + S.board[r].f[p], 0);
const neighbours = r => EDGES.map((e, i) => e[0] === r ? [e[1], i] : e[1] === r ? [e[0], i] : null).filter(Boolean);
const edgeBlockedFor = (S, i, p) => S.blocked.some(b => b.e === i && b.vs === p);

// ---------- setup ----------
function newGame(o = {}) {
  const seed = (o.seed ?? Math.floor(Math.random() * 2 ** 31)) >>> 0;
  const S = {
    v: 1, seed, rng: seed, opts: {fan: o.fan !== false, allies: !!o.allies},
    seats: o.seats || [{name: 'Fellowship', type: 'human', level: 'normal'}, {name: 'Sauron', type: 'ai', level: 'normal'}],
    chapter: 0, slots: [], decks: {}, discard: [], tilesFace: [], tilesDeck: [], tileLocks: [], stacks: {}, stackLocks: [],
    players: [mkPlayer('fellowship'), mkPlayer('sauron')], board: {}, blocked: [], questBlock: [0, 0],
    active: 1, turnNo: 1, extra: 0, queue: [], pending: null, mainDone: false, allyUsed: false, forced: null,
    log: [], winner: null, sim: false, irrev: false,
  };
  for (const r of REGION_IDS) S.board[r] = {u: [0, 0], f: [0, 0]};
  S.board.arnor.u[0] = 2; S.board.mordor.u[1] = 2;
  S.players[0].units -= 2; S.players[1].units -= 2;
  for (const ch of [1, 2, 3]) S.decks[ch] = shuffle(S, CARD_IDS.filter(id => CARDS[id].ch === ch));
  const base = shuffle(S, Object.keys(TILES).filter(t => !TILES[t].fan));
  S.tilesFace = base.slice(0, 3);
  S.tilesDeck = base.slice(3);
  if (S.opts.fan) { S.tilesDeck.push('shire', 'grond'); shuffle(S, S.tilesDeck); }
  for (const r of RACES) S.stacks[r] = shuffle(S, Object.keys(TOKENS).filter(t => TOKENS[t].race === r)).map(id => ({id, known: false}));
  if (S.opts.allies) {
    for (const p of [0, 1]) {
      const mine = shuffle(S, Object.keys(ALLIES).filter(a => ALLIES[a].side === SIDES[p]));
      S.players[p].allies.hand = mine.slice(0, 3);
      S.players[p].power = 1;
    }
  }
  log(S, 'Sauron begins. Chapter 1.', 'chapter');
  setupChapter(S, 1);
  return S;
}

function setupChapter(S, ch) {
  S.chapter = ch;
  const ids = S.decks[ch]; S.decks[ch] = [];
  S.slots = [];
  let k = 0;
  LAYOUTS[ch].forEach(([n, face], r) => {

// ---------- costs ----------

// ---------- legal actions ----------

// ---------- apply ----------

      break;
    }
    case 'discardOppToken':
      ask(N, st, 'oppToken', "Discard 1 Alliance token from your opponent's play area", O.tokens.map(t => ({label: `${RACE_NAMES[tokenRace(t)]}: ${TOKENS[t].text}`, token: t})));
      break;
    case 'lockTile': {
      const ts = N.tilesFace.filter(t => !N.tileLocks.includes(t));
      ask(N, st, 'tile', 'Uruk-Hai Chief: lock which Landmark?', ts.map(t => ({label: TILES[t].name, tile: t, lock: true})));
      break;
    }
    case 'freeTile':
      ask(N, st, 'tile', 'Take a faceup Landmark for free', N.tilesFace.filter(t => t !== 'grond' || enemyFortExists(N, p)).map(t => ({label: TILES[t].name, tile: t})));
      break;
    case 'blockEdge': {
      const o = EDGES.map((e, i) => ({e, i})).filter(({i}) => !N.blocked.some(b => b.e === i)).map(({e, i}) => ({label: `${rname(e[0])} \u2013 ${rname(e[1])}`, edge: i}));
      ask(N, st, 'edge', st.strike ? 'Balrog: block a connection and strike both regions' : 'Balrog: block which connection?', o);
      break;
    }
    case 'forceReveal': {
      const A = O.allies;
      if (!A.hand.length) break;
      const a = A.hand.splice(Math.floor(rnd(N) * A.hand.length), 1)[0];
      A.front.push(a); N.irrev = true;
      log(N, `${ALLIES[a].name} is forced into play without its enter effect.`, 'ally');
      break;
    }
    case 'copyExit':
      ask(N, st, 'copy', "Warg: apply which enemy Ally's exit effect for yourself?", O.allies.front.map(a => ({label: `${ALLIES[a].name}: ${ALLIES[a].xt}`, ally: a})));
      break;
    case 'grima': {
      const o = availableSlots(N).map(i => ({label: cardLabel(N.slots[i].id), slot: i, card: N.slots[i].id}));
      ask(N, st, 'grima', st.mode === 'any' ? 'Gr\u00edma: your opponent must take which card (play or discard)?' : 'Gr\u00edma: your opponent must take and discard which card?', o);
      break;
    }
    case 'endMain':
      revealAvailable(N);
      if (N.slots.every(s => s.taken)) endChapter(N);
      N.mainDone = true;
      checkWin(N);
      maybeAutoEnd(N);
      break;
    case 'afterAlly':
      revealAvailable(N);
      if (N.slots.every(s => s.taken)) {
        endChapter(N);
        if (N.chapter === 3 && N.winner) break;
      }
      maybeAutoEnd(N);
      break;
  }
}

function choose(N, pd, o) {
  const st = pd.st, p = st.p, P = N.players[p], O = N.players[opp(p)];
  if (o.skip) { log(N, `${pname(N, p)} skips.`, 'skip'); return; }
  switch (pd.type) {
    case 'region':
      placeUnits(N, p, o.region, st.n); break;
    case 'units2':
      if (o.regions[0] === o.regions[1]) placeUnits(N, p, o.regions[0], 2);
      else { placeUnits(N, p, o.regions[0], 1); placeUnits(N, p, o.regions[1], 1); }
      break;
    case 'move':
      N.board[o.from].u[p]--; N.board[o.to].u[p]++;
      log(N, `${pname(N, p)} moves a Unit ${rname(o.from)} \u2192 ${rname(o.to)}.`, 'move');
      conflict(N, o.to);
      if (st.n > 1) N.queue.unshift({k: 'move', n: st.n - 1, p});
      break;
    case 'remove':
      N.board[o.region].u[opp(p)]--; O.units++;
      log(N, `${pname(N, p)} removes an enemy Unit from ${rname(o.region)}.`, 'remove'); break;
    case 'removeAll': {
      const n = N.board[o.region].u[opp(p)];
      N.board[o.region].u[opp(p)] = 0; O.units += n;
      log(N, `${pname(N, p)} removes ${n} enemy Unit${n > 1 ? 's' : ''} from ${rname(o.region)}.`, 'remove'); break;
    }
    case 'removeFort':
      N.board[o.region].f[opp(p)]--; O.forts++;
      log(N, `${pname(N, p)} removes an enemy Fortress from ${rname(o.region)}.`, 'fort'); break;
    case 'turn': N.queue.unshift({k: 'extraTurn', p}); break;
    case 'choice': N.queue.unshift({...o.step, p}); break;
    case 'order': N.queue.unshift(...o.steps.map(s => ({...s}))); break;
    case 'token': {
      gainTokenFromDraw(N, p, st.drawn, o.token);
      break;
    }
    case 'race':
      if (o.lock) { N.stackLocks.push(o.race); log(N, `Shelob locks the ${RACE_NAMES[o.race]} Alliance tokens.`, 'ally'); }
      else if (st.k === 'anyRaceDraw') drawTokens(N, st, [o.race], 2);
      else { N.irrev = true; gainToken(N, p, N.stacks[o.race].shift().id); }
      break;
    case 'discard': {
      N.discard.splice(o.di, 1);
      log(N, `${pname(N, p)} plays ${cardLabel(o.card)} from the discard.`, 'play');
      N.queue.unshift({k: 'playCard', id: o.card, chained: false, p});
      break;
    }
    case 'chapter': {
      const idx = N.discard.map((d, i) => d.ch === o.ch ? i : -1).filter(i => i >= 0);
      const di = idx[Math.floor(rnd(N) * idx.length)], d = N.discard.splice(di, 1)[0];
      N.irrev = true;
      log(N, `${pname(N, p)} draws ${cardLabel(d.id)} from the discard and plays it.`, 'play');
      N.queue.unshift({k: 'playCard', id: d.id, chained: false, p});
      break;
    }
    case 'grey':
      O.cards = O.cards.filter(id => id !== o.card);
      if (o.steal) { P.cards.push(o.card); log(N, `${pname(N, p)} takes ${cardLabel(o.card)} from ${pname(N, opp(p))}.`, 'grey'); }
      else { N.discard.push({id: o.card, hidden: false, ch: CARDS[o.card].ch, seen: [true, true]}); log(N, `${pname(N, p)} discards ${pname(N, opp(p))}'s ${cardLabel(o.card)}.`, 'grey'); }
      break;
    case 'shire':
      N.slots[o.slot].taken = true;
      log(N, `${pname(N, p)} plays ${cardLabel(o.card)} through The Shire.`, 'play');
      N.queue.unshift({k: 'playCard', id: o.card, chained: false, p});
      break;
    case 'grond': {
      const r = o.region;
      N.board[r].f[opp(p)]--; O.forts++;
      log(N, `Grond breaks the enemy Fortress in ${rname(r)}.`, 'fort');
      if (N.board[r].u[opp(p)] > 0) {
        ask(N, {...st, region: r}, 'retreat', `Enemy Units in ${rname(r)} retreat to which adjacent region?`, regionOpts(neighbours(r).map(x => x[0])));
      } else N.queue.unshift({k: 'grondPlace', region: r, p});
      break;
    }
    case 'retreat': {
      const r = st.region, n = N.board[r].u[opp(p)];
      N.board[r].u[opp(p)] = 0; N.board[o.region].u[opp(p)] += n;
      log(N, `${n} enemy Unit${n > 1 ? 's' : ''} retreat to ${rname(o.region)}.`, 'move');
      conflict(N, o.region);
      N.queue.unshift({k: 'grondPlace', region: r, p});
      break;
    }
    case 'faramir': {
      const s = N.slots[o.slot];
      s.taken = true;
      N.discard.push({id: s.id, hidden: false, ch: CARDS[s.id].ch, seen: [true, true]});
      log(N, `${pname(N, p)} discards ${cardLabel(s.id)} from the central play area.`, 'discard');
      break;
    }
    case 'oppToken':
      O.tokens = O.tokens.filter(t => t !== o.token);
      log(N, `${pname(N, p)} discards ${pname(N, opp(p))}'s ${RACE_NAMES[tokenRace(o.token)]} token.`, 'token');
      break;
    case 'tile':
      if (o.lock) { N.tileLocks.push(o.tile); log(N, `The Uruk-Hai Chief locks ${TILES[o.tile].name}.`, 'ally'); }
      else {
        N.tilesFace = N.tilesFace.filter(t => t !== o.tile);
        log(N, `${pname(N, p)} builds ${TILES[o.tile].name} for free.`, 'tile');
        N.queue.unshift(...tileSteps(N, p, o.tile).map(s => ({...s, p})));
      }
      break;
    case 'edge': {
      N.blocked.push({e: o.edge, vs: opp(p)});
      log(N, `The Balrog blocks ${o.label}.`, 'ally');
      if (st.strike) for (const r of EDGES[o.edge]) if (N.board[r].u[opp(p)] > 0) { N.board[r].u[opp(p)]--; O.units++; log(N, `The Balrog removes an enemy Unit from ${rname(r)}.`, 'remove'); }
      break;
    }
    case 'copy':
      log(N, `${pname(N, p)} copies ${ALLIES[o.ally].name}'s exit effect.`, 'ally');
      N.queue.unshift(...ALLIES[o.ally].exit.map(s => ({...s, p})));
      break;
    case 'grima':
      N.forced = {p: opp(p), slot: o.slot, mode: st.mode};
      log(N, `Gr\u00edma: next turn ${pname(N, opp(p))} must take ${cardLabel(o.card)}${st.mode === 'discard' ? ' and discard it' : ''}.`, 'ally');
      break;
  }
}
function gainTokenFromDraw(N, p, drawn, keep) {
  const back = drawn.filter(t => t !== keep);
  for (let i = back.length - 1; i >= 0; i--) N.stacks[tokenRace(back[i])].unshift({id: back[i], known: true});
  gainToken(N, p, keep);
}

function cardLabel(id) {
  const c = CARDS[id];
  let e = '';
  if (c.coins) e = `${c.coins} Coins`;
  else if (c.quest) e = `${c.quest} Ring${c.quest > 1 ? 's' : ''}`;
  else if (c.race) e = RACE_NAMES[c.race];
  else if (c.units) e = `${c.units} Unit${c.units > 1 ? 's' : ''}: ${c.regions.map(rname).join(' / ')}`;
  else if (c.purple) e = c.purple.map(x => ({rmU: 'remove Unit', lose: '-1 Coin', move: 'move'})[x]).join(', ');
  else if (c.skills) e = c.skills.map(g => g.map(s => SKILL_NAMES[s]).join('/')).join(' + ');
  return `${c.color[0].toUpperCase() + c.color.slice(1)} (${e})`;
}

// ---------- views, results, determinisation ----------
function result(S) {
  const rows = [0, 1].map(p => {
    const P = S.players[p];
    return {name: pname(S, p), side: SIDES[p], regions: regionCount(S, p), races: distinctRaces(P), quest: P.quest, coins: P.coins,
      cards: P.cards.length, landmarks: P.landmarks.length, units: REGION_IDS.reduce((n, r) => n + S.board[r].u[p], 0)};
  });
  const w = S.winner;
  rows.forEach((r, p) => { r.rank = !w ? null : w.p === 'tie' ? 1 : w.p === p ? 1 : 2; });
  return {over: !!w, winner: w ? w.p : null, reason: w ? w.reason : null, reasonText: w ? REASONS[w.reason] : '', rows};
}

// A copy of S in which everything `viewer` cannot know is re-dealt at random (for AI search).
function determinize(S, viewer, seed) {
  const N = structuredClone(S);
  N.sim = true; N.log = []; N.rng = seed >>> 0;
  for (const ch of [1, 2, 3]) {
    const places = [];
    N.slots.forEach(s => { if (!s.taken && !s.face && CARDS[s.id].ch === ch) places.push(s); });
    N.discard.forEach(d => { if (d.hidden && !d.seen[viewer] && d.ch === ch) places.push(d); });
    const pool = shuffle(N, [...places.map(x => x.id), ...N.decks[ch]]);
    places.forEach((x, i) => { x.id = pool[i]; });
    N.decks[ch] = pool.slice(places.length);
  }
  shuffle(N, N.tilesDeck);
  for (const r of RACES) {
    const st = N.stacks[r], idx = st.map((t, i) => t.known ? -1 : i).filter(i => i >= 0);
    const ids = shuffle(N, idx.map(i => st[i].id));
    idx.forEach((i, k) => { st[i].id = ids[k]; });
  }
  if (N.opts.allies) {
    const o = opp(viewer), A = N.players[o].allies;
    const pool = shuffle(N, Object.keys(ALLIES).filter(a => ALLIES[a].side === SIDES[o] && !A.front.includes(a) && !A.gone.includes(a)));
    A.hand = pool.slice(0, A.hand.length);
  }
  return N;
}

const Engine = {newGame, legalActions, apply, result, determinize, cardCost, tileCost, missingSkills, availableSlots, slotAvailable,
  distinctRaces, regionCount, present, fortsOnBoard, allyActions, cardLabel, opp, REASONS, forcedSlot, moveOpts, neighbours};

// ===== AI: uses the same engine. Easy = greedy + noise, Normal = 2 plies (deterministic per seed),
// Hard = several determinisations, 3-ply alpha-beta over whole turns, time-boxed. =====
const AI = (() => {
  const E = Engine;
  let budgetMs = 1200;

  function progress(S) {
    const taken = S.slots.filter(s => s.taken).length;
    return Math.min(1, ((S.chapter - 1) * 20 + taken) / 60);
  }
  function parts(S, p) {
    const P = S.players[p];
    const q = Math.max(0, P.quest - 0.6 * S.questBlock[p]) / QUEST_LEN;
    const r = E.distinctRaces(P) / 6;
    const g = E.regionCount(S, p) / 7;
    return {
      quest: 3 * q * q + 8 * Math.max(0, q - 0.75) ** 2,
      races: 2.6 * r * r + 6 * Math.max(0, r - 0.66) ** 2,
      regions: 2.2 * g * g + 6 * Math.max(0, g - 0.7) ** 2,
    };
  }
  function evalSide(S, p) {
    const P = S.players[p], pr = progress(S), pt = parts(S, p);
    let v = pt.quest + pt.races + pt.regions;
    v += 0.04 * Math.min(P.coins, 10) + 0.01 * Math.max(0, P.coins - 10);
    let skills = 0;
    for (const id of P.cards) { const c = CARDS[id]; if (c.skills) for (const g of c.skills) skills += g.length > 1 ? 0.7 : 1; }
    v += 0.05 * skills * (1 - 0.6 * pr);
    const takenIds = new Set([...S.players[0].cards, ...S.players[1].cards]);
    for (const id of P.cards) {
      const out = CARDS[id].chainOut;
      if (out && pr < 0.95) { const tgt = CARD_IDS.find(x => CARDS[x].chainIn === out); if (tgt && !takenIds.has(tgt)) v += 0.03; }
    }
    v += 0.06 * P.tokens.length + 0.04 * P.power + 0.05 * P.allies.hand.length + 0.04 * P.allies.front.length;
    for (const r of REGION_IDS) {
      const b = S.board[r];
      if (b.f[p]) v += 0.04;
      if (b.u[p] > 1) v += 0.015 * Math.min(3, b.u[p] - 1);
    }
    if (S.active === p) v += 0.15 * S.extra;
    return v;
  }
  function evaluate(S, p) {
    if (S.winner) return S.winner.p === 'tie' ? 0 : S.winner.p === p ? 1000 : -1000;
    const pr = progress(S);
    const lead = (E.regionCount(S, p) - E.regionCount(S, opp(p))) / 7;
    return evalSide(S, p) - evalSide(S, opp(p)) + 1.5 * pr * pr * lead;
  }

  // ---- simulation helpers ----
  function greedyIndex(S, p, noise) {
    const n = S.pending.opts.length;
    let best = 0, bv = -Infinity;
    for (let i = 0; i < n; i++) {
      const v = evaluate(E.apply(S, {t: 'choose', i}), p) + (noise ? noise() : 0);
      if (v > bv) { bv = v; best = i; }
    }
    return best;
  }
  function resolve(S, p, noise) {
    let guard = 0;
    while (!S.winner && S.pending && S.pending.p === p && guard++ < 60) S = E.apply(S, {t: 'choose', i: greedyIndex(S, p, noise)});
    return S;
  }
  // Apply a whole turn-step for p: the action plus greedy sub-decisions; end the turn unless p keeps the move.
  function macro(S, a, p, noise) {
    let N = resolve(E.apply(S, a), p, noise);
    if (!N.winner && !N.pending && N.active === p && N.mainDone) N = E.apply(N, {t: 'end'});
    return N;
  }
  function ordered(S, p, beam, noise) {
    const mover = S.active;
    const acts = E.legalActions(S).map(a => {
      const N = macro(S, a, mover, noise);
      return {a, N, v: evaluate(N, mover)};
    });
    acts.sort((x, y) => y.v - x.v);
    return beam ? acts.slice(0, beam) : acts;
  }
  function search(S, root, depth, alpha, beta, deadline, beam) {
    if (S.winner || depth === 0 || performance.now() > deadline) return evaluate(S, root);
    if (S.pending) S = resolve(S, S.pending.p);
    if (S.winner) return evaluate(S, root);
    const kids = ordered(S, root, beam);
    if (!kids.length) return evaluate(S, root);
    const maxi = S.active === root;
    let best = maxi ? -Infinity : Infinity;
    for (const k of kids) {
      const v = depth === 1 ? evaluate(k.N, root) : search(k.N, root, depth - 1, alpha, beta, deadline, beam);
      if (maxi) { best = Math.max(best, v); alpha = Math.max(alpha, v); } else { best = Math.min(best, v); beta = Math.min(beta, v); }
      if (beta <= alpha) break;
    }
    return best;
  }

  function seedFor(S, k = 0) { return (S.seed ^ Math.imul(S.turnNo + 17, 2654435761) ^ Math.imul(k + 1, 40503) ^ S.log.length) >>> 0; }
  function noiseFn(S, amp) {
    const st = {rng: seedFor(S, 99)};
    return () => (rndOf(st) - 0.5) * 2 * amp;
  }
  function rndOf(st) {
    let t = (st.rng = (st.rng + 0x6D2B79F5) >>> 0);
    t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }

  // ---- decisions ----
  function decide(S, level = 'normal', opts = {}) {
    const p = S.pending ? S.pending.p : S.active;
    const acts = E.legalActions(S);
    if (acts.length <= 1) return acts[0];
    const t0 = performance.now(), budget = opts.budget ?? budgetMs;
    if (level === 'easy') {
      const D = E.determinize(S, p, seedFor(S)), noise = noiseFn(S, 0.35);
      return pickMax(acts, a => S.pending ? evaluate(E.apply(D, a), p) + noise() : evaluate(macro(D, a, p, noise), p) + noise());
    }
    if (level === 'normal') {
      const D = E.determinize(S, p, seedFor(S));
      return pickMax(acts, a => twoPly(D, a, p));
    }
    // hard: average over determinisations, deepen while time allows
    const deadline = t0 + budget, K = 3, totals = new Array(acts.length).fill(0);
    let rounds = 0;
    for (let k = 0; k < K && performance.now() < deadline; k++) {
      const D = E.determinize(S, p, seedFor(S, k));
      const vals = acts.map(a => twoPly(D, a, p));
      acts.forEach((_, i) => { totals[i] += vals[i]; });
      rounds++;
    }
    let order = acts.map((a, i) => ({a, i, v: totals[i] / rounds})).sort((x, y) => y.v - x.v);
    const top = order.slice(0, 6);
    if (performance.now() < deadline - 50) {
      const deep = top.map(x => ({...x, d: 0, n: 0}));
      for (let k = 0; k < K && performance.now() < deadline; k++) {
        const D = E.determinize(S, p, seedFor(S, k + 7));
        for (const x of deep) {
          if (performance.now() > deadline) break;
          let N = S.pending ? resolve(E.apply(D, x.a), p) : macro(D, x.a, p);
          x.d += search(N, p, 2, -Infinity, Infinity, deadline, 5); x.n++;
        }
      }
      for (const x of deep) if (x.n) x.v = 0.4 * x.v + 0.6 * (x.d / x.n);
      deep.sort((x, y) => y.v - x.v);
      return deep[0].a;
    }
    return order[0].a;
  }
  function twoPly(D, a, p) {
    let N = D.pending ? resolve(E.apply(D, a), p) : macro(D, a, p);
    if (N.winner || N.active === p) return evaluate(N, p);
    const o = N.active;
    let worst = Infinity;
    for (const b of E.legalActions(N)) {
      const M = macro(N, b, o);
      worst = Math.min(worst, evaluate(M, p));
      if (worst <= -1000) break;
    }
    return worst === Infinity ? evaluate(N, p) : worst;
  }
  function pickMax(acts, f) {
    let best = acts[0], bv = -Infinity;
    for (const a of acts) { const v = f(a); if (v > bv) { bv = v; best = a; } }
    return best;
  }

  // ---- rival intel: non-invasive hints about the opponent of `viewer` ----
  function intel(S, viewer) {
    const o = opp(viewer), P = S.players[o], name = (S.seats[o] && S.seats[o].name) || SIDE_NAMES[SIDES[o]];
    const out = [];
    const left = QUEST_LEN - P.quest;
    out.push(o === 0 ? `Frodo and Sam are ${left} space${left === 1 ? '' : 's'} from Mount Doom.` : `The Nazg\u00fbl are ${left} space${left === 1 ? '' : 's'} from catching Frodo and Sam.`);
    const have = new Set(greens(P));
    const missing = RACES.filter(r => !have.has(r)).map(r => RACE_NAMES[r]);
    out.push(`${name} has ${E.distinctRaces(P)} of 6 Race symbols${missing.length && missing.length < 6 ? ` (missing ${missing.join(', ')}${hasHook(P, 'eagle') ? '; has the Eagle' : ''})` : ''}.`);
    const absent = REGION_IDS.filter(r => !E.present(S, o, r)).map(rname);
    out.push(`${name} is present in ${7 - absent.length} of 7 regions${absent.length && absent.length < 4 ? ` (not in ${absent.join(', ')})` : ''}.`);
    const avail = E.availableSlots(S);
    const afford = avail.filter(i => E.cardCost(S, o, S.slots[i].id).coins <= P.coins).length;
    out.push(`${name} has ${P.coins} Coin${P.coins === 1 ? '' : 's'} and could play ${afford} of the ${avail.length} available cards.`);
    const pt = parts(S, o);
    const top = Object.entries(pt).sort((a, b) => b[1] - a[1])[0][0];
    out.push(`Main threat: ${{quest: 'the Quest of the Ring', races: 'Support of the Races', regions: 'Conquest of Middle-earth'}[top]}.`);
    if (S.opts.allies) out.push(`${name} has ${P.power} Power token${P.power === 1 ? '' : 's'} and ${P.allies.hand.length} hidden Ally card${P.allies.hand.length === 1 ? '' : 's'}.`);
    return out;
  }

  return {decide, evaluate, intel, parts, setBudget: ms => { budgetMs = ms; }};
})();

// ===== ?test rule tests and ?selfplay harness. Pure: no DOM. =====
const Tests = (() => {
  const E = Engine;
  const T = [];
  const test = (name, fn) => T.push({name, fn});
  function eq(a, b, msg) { if (JSON.stringify(a) !== JSON.stringify(b)) throw new Error(`${msg || 'expected'}: ${JSON.stringify(b)}, got ${JSON.stringify(a)}`); }

    const S = E.newGame({seed: o.seed ?? 12345, fan: o.fan ?? false, allies: o.allies ?? false,

    S.sim = false;
    if (o.active !== undefined) S.active = o.active;
    return S;
  }
  function slotFor(S) { return E.availableSlots(S)[0]; }
  function place(S, id) { const i = slotFor(S); S.slots[i].id = id; S.slots[i].face = true; return i; }
  function play(S, id, mode = 'play') {
    const i = place(S, id);
    const a = E.legalActions(S).find(x => x.t === 'take' && x.slot === i && x.mode === mode);
    ok(a, `no ${mode} action for ${id}`);
    return E.apply(S, a);
  }
  function give(S, p, ids) { for (const id of ids) S.players[p].cards.push(id); return S; }
  function pick(S, pred, msg) {
    ok(S.pending, `no pending decision (${msg || ''})`);
    const i = S.pending.opts.findIndex(pred);
    ok(i >= 0, `option not found (${msg || S.pending.type})`);
    return E.apply(S, {t: 'choose', i});
  }
  const hasSkip = S => S.pending && S.pending.opts.some(o => o.skip);

// ---------- zoom (pinch, wheel, drag) ----------
function applyZoom(el) {
  const z = UI.zoom[el.dataset.z] || {s: 1, x: 0, y: 0};
  el.firstElementChild.nextElementSibling.style.transform = `translate(${z.x}px,${z.y}px) scale(${z.s})`;
}
const ptrs = new Map();
let moved = false, pinch = null;
function zoomOf(el) { return UI.zoom[el.dataset.z] || (UI.zoom[el.dataset.z] = {s: 1, x: 0, y: 0}); }

}
document.addEventListener('pointerdown', e => {
  const el = e.target.closest('.zoom'); if (!el) return;
  if (UI.edit && e.target.closest('[data-a="region"]')) { UI.drag = {r: e.target.closest('[data-a="region"]').dataset.r, el}; return; }
  ptrs.set(e.pointerId, {x: e.clientX, y: e.clientY, el}); moved = false;
  if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; pinch = {d: Math.hypot(a.x - b.x, a.y - b.y), z: {...zoomOf(el)}, cx: (a.x + b.x) / 2, cy: (a.y + b.y) / 2}; }
});
document.addEventListener('pointermove', e => {
  if (UI.drag) {
    const svg = UI.drag.el.querySelector('svg'), pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
    const q = pt.matrixTransform(svg.getScreenCTM().inverse()), R = REGIONS.find(r => r.id === UI.drag.r);
    R.x = Math.round(q.x / 5) * 5; R.y = Math.round(q.y / 5) * 5; renderGame(); return;
  }
  const p = ptrs.get(e.pointerId); if (!p) return;

    clampZ(z, el); applyZoom(el); moved = true; return;
  }
  const dx = e.clientX - p.x, dy = e.clientY - p.y;
  if (Math.abs(dx) + Math.abs(dy) > 8) moved = true;
  if (moved && z.s > 1) { z.x += dx; z.y += dy; p.x = e.clientX; p.y = e.clientY; clampZ(z, el); applyZoom(el); }
});
const endPtr = e => { ptrs.delete(e.pointerId); if (ptrs.size < 2) pinch = null; if (UI.drag) UI.drag = null; };
document.addEventListener('pointerup', endPtr); document.addEventListener('pointercancel', endPtr);
document.addEventListener('wheel', e => {
  const el = e.target.closest('.zoom'); if (!el || !UI.S) return;
  e.preventDefault();

  z.x = cx - (cx - z.x) * ns / z.s; z.y = cy - (cy - z.y) * ns / z.s; z.s = ns; clampZ(z, el); applyZoom(el);
}, {passive: false});

function modal({title, body, x = true, dock = true, buttons = []}) {

  b.innerHTML = `<div class="modal" role="dialog" aria-label="${esc(title)}"><div class="mh"><h2>${esc(title)}</h2>${dock ? `<button class="ghost" data-m="dock" title="Dock to side">\u21E5</button>` : ''}${x ? `<button class="ghost" data-m="x" aria-label="Close">\u2715</button>` : ''}</div>

  b.addEventListener('click', e => {

// ---------- ?test, ?selfplay, ?freeze ----------
function runTests() {
  const r = Tests.run();
  document.title = `TESTS ${r.pass}/${r.total}`;
  $('#app').innerHTML = `<div class="testlist"><h2>TESTS ${r.pass}/${r.total}</h2>${r.res.map(x => `<div class="${x.ok ? 'p' : 'f'}">${x.ok ? '\u2713' : '\u2717'} ${esc(x.name)}${x.ok ? '' : '\n   ' + esc(x.err)}</div>`).join('')}</div>`;
}
function runSelfplay() {
  const levels = (Q.get('levels') || 'normal,normal').split(','), n = +(Q.get('n') || 1), seed0 = +(Q.get('seed') || 1000);
  const fan = Q.get('fan') !== '0', allies = Q.get('allies') === '1', budget = +(Q.get('budget') || 400), pass = Q.get('pnp') === '1';
  const tally = {fellowship: 0, sauron: 0, tie: 0};
  let steps = 0, last = '';
  UI.auto = true;
  try {
    for (let g = 0; g < n; g++) {
      const seats = [0, 1].map(p => ({name: SIDE_NAMES[SIDES[p]], type: pass || p === 0 ? 'human' : 'ai', level: levels[p] || 'normal'}));
      UI.S = Engine.newGame({seed: seed0 + g, fan, allies, seats}); UI.undo = []; UI.viewer = 0;
      let k = 0;
      while (!UI.S.winner) {
        if (++k > 3000) throw new Error('stalled at seed ' + (seed0 + g));
        const p = actor(UI.S);
        if (pass && UI.viewer !== p) UI.viewer = p;
        const a = AI.decide(UI.S, seat(p).level, {budget});
        const legal = Engine.legalActions(UI.S);
        if (!legal.some(x => JSON.stringify(x) === JSON.stringify(a))) throw new Error('illegal AI action ' + JSON.stringify(a));
        commit(a, isHuman(p));
        if (k % 7 === 0) renderGame();
      }
      steps += k;
      const w = UI.S.winner; tally[w.p === 'tie' ? 'tie' : SIDES[w.p]]++;
      last = `${w.p === 'tie' ? 'tie' : SIDES[w.p]} ${w.reason}`;
    }
    UI.auto = false; renderGame();
    document.title = n === 1 ? `SELFPLAY DONE ${last} in ${steps} steps` : `SELFPLAY DONE ${n} games F${tally.fellowship}/S${tally.sauron}/T${tally.tie} in ${steps} steps`;
  } catch (e) {
    UI.auto = false;
    document.title = `SELFPLAY ERROR ${e.message}`;
    $('#app').insertAdjacentHTML('afterbegin', `<pre class="testlist f">${esc(e.stack || e)}</pre>`);
  }
}
function runFreeze() {
  const o = {side: Q.get('side') || 'fellowship', opp: Q.get('opp') || 'normal', fan: Q.get('fan') !== '0', allies: Q.get('allies') === '1'};
  startGame(o, +(Q.get('seed') || 7));
  clearTimeout(UI.timer);
  const turns = +(Q.get('turns') || 0);
  UI.auto = true;
  for (let k = 0; k < turns && !UI.S.winner; k++) { const p = actor(UI.S); commit(AI.decide(UI.S, 'easy'), false); }
  // Hand the move back to the human seat if possible so the screenshot shows the action bar.
  let g = 0;
  const wantPending = Q.get('until') === 'pending';
  while (!UI.S.winner && g++ < 400 && (!isHuman(actor(UI.S)) || (wantPending && !(UI.S.pending && UI.S.pending.opts.some(o => o.region || o.from)))))
    commit(AI.decide(UI.S, 'easy'), false);
  UI.auto = false;
  if (Q.get('tab')) UI.tab = Q.get('tab');
  if (Q.get('view')) UI.view = Q.get('view');
  autoView(); renderGame();
  const pop = Q.get('popup');
  if (pop === 'help') showHelp();
  if (pop === 'card') { const i = Engine.availableSlots(UI.S).find(k => UI.S.slots[k].face); if (i !== undefined) onSlot(i); }
  if (pop === 'menu') showMenu();
  document.title = `FROZEN turn ${UI.S.turnNo}`;
}

function boot() {
  if (Q.has('test')) return runTests();
  if (Q.has('selfplay')) return runSelfplay();
  if (UI.freeze) return runFreeze();
  landing();
}
boot();

</script>
